<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testable Todo Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <article class="todo-card" data-testid="test-todo-card" id="task-card">
    
    <header class="card-header">
      <h2 class="card-title" data-testid="test-todo-title">Implement Authentication Flow</h2>
      
      <span class="badge high" data-testid="test-todo-priority" aria-label="Priority: High">High</span>
    </header>

    <p class="card-description" data-testid="test-todo-description">
      Ensure OAuth2 and JWT implementations are completed for the new user dashboard login process.
    </p>

    <div class="meta-info">
      <div>
        Status: <strong data-testid="test-todo-status" id="task-status">Pending</strong>
      </div>
      <div>
        Deadline: <time data-testid="test-todo-due-date" id="due-date-element"></time>
      </div>
      <div>
        <span data-testid="test-todo-time-remaining" id="time-remaining" aria-live="polite">Loading time...</span>
      </div>
    </div>

    <ul class="tags-list" role="list" data-testid="test-todo-tags">
      <li class="tag-item" data-testid="test-todo-tag-work">work</li>
      <li class="tag-item" data-testid="test-todo-tag-urgent">urgent</li>
      <li class="tag-item">backend</li>
    </ul>

    <footer class="card-actions">
      
      <div class="checkbox-group">
        <input type="checkbox" id="complete-toggle" data-testid="test-todo-complete-toggle">
        <label for="complete-toggle">Mark as complete</label>
      </div>

      <div class="button-group">
        <button type="button" data-testid="test-todo-edit-button" id="edit-btn">Edit</button>
        <button type="button" class="delete-btn" data-testid="test-todo-delete-button" id="delete-btn" aria-label="Delete task">Delete</button>
      </div>

    </footer>

  </article>

  <script src="script.js"></script>
</body>
</html>
